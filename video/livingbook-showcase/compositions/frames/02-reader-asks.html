    <script>
      (function () {

        var tl = gsap.timeline({ paused: true });

            p: Math.PI * 2 * 2,
            duration: DUR,

              var dx = Math.sin(drift.p) * 5;

              camera.style.transform =
                "scale(" + cam.scale + ") translate(" + dx + "px, " + (cam.ty + dy) + "px)";

        // Bloom breathes once across the shot

        /* ---------- Scene 1 (0-1.6s): label, per-word title, author, avatar ---------- */

        tl.fromTo("#f02ra-w2", { opacity: 0, y: 42 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.68);
        tl.fromTo("#f02ra-w3", { opacity: 0, y: 42 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.86);
        tl.fromTo("#f02ra-titlerule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.9);
        tl.fromTo("#f02ra-author", { opacity: 0, x: -22 }, { opacity: 0.85, x: 0, duration: 0.55, ease: "power3.out" }, 1.15);

        var SEQ = [

          { t: 2.2, text: "Wha", color: INK },
          { t: 2.3, text: "What", color: INK },

          { t: 3.08, text: "What does OUT O", color: SUN },

          { t: 3.3, text: "What does OUT OF FOC", color: SUN },
          { t: 3.42, text: "What does OUT OF FOCUS", color: SUN },
          { t: 3.74, text: "What does OUT OF FOCUS say", color: INK },
          { t: 3.86, text: "What does OUT OF FOCUS say ab", color: INK },

          { t: 4.08, text: "What does OUT OF FOCUS say about the", color: INK },

          { t: 4.92, text: "What does OUT OF FOCUS say about the psychiatrist shortage?", color: INK },

        // Baked typing events — pure of runtime state, reverse-seek-safe
        var CHANGE_TIMES = [];

        var TYPING_GRACE = 0.18;
        var BLINK_CYCLES = 7; // whole number over DUR — no pop on the last frame
        var CURSOR_ON_AT = 1.72; // cursor exists only once the input has landed

        function entryAt(t) {
          for (var i = SEQ.length - 1; i >= 0; i--) {
            if (t >= SEQ[i].t) return SEQ[i];
          }
          return SEQ[0];
        }

        var typedEl = document.getElementById("f02ra-typed");
        var cursorEl = document.getElementById("f02ra-cursor");

            ease: "none",

              var t = driver.t;
              var entry = entryAt(t);
              typedEl.textContent = entry.text;
              cursorEl.style.background = entry.color;
              if (t < CURSOR_ON_AT) {
                cursorEl.style.opacity = "0";
                return;
              }
              var isTyping = false;
              for (var i = 0; i < CHANGE_TIMES.length; i++) {
                if (CHANGE_TIMES[i] <= t && t - CHANGE_TIMES[i] < TYPING_GRACE) {

              var blinkOn = Math.sin((t / DUR) * Math.PI * 2 * BLINK_CYCLES) > 0;
