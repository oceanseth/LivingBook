      );
      /* the pulse is absorbed into the tile's glow */
      tl.to("#f08sap-pulse-core", { opacity: 0, scale: 0.4, duration: 0.45, ease: "power1.in" }, 11.7);

      tl.fromTo(
        "#f08sap-play",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        11.95
      );
      tl.fromTo(
        "#f08sap-answer-label",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power1.out" },
        12.5
      );
      /* quiet settle: the answer's glow deepens under the held camera */
      tl.to("#f08sap-tileglow-inner", { opacity: 0.85, duration: 1.6, ease: "power1.inOut" }, 12.9);

      /* drift driver spans the whole shot — the ONE transform writer.
         Registered LAST so its onUpdate reads cam.x AFTER the pan tweens
         have updated it in the same render pass (seek-safe). */
      tl.to(
        drift,
        { p: Math.PI * 2 * 2, duration: DUR, ease: "none", onUpdate: applyCamera },
        0
      );
    })();
  </script>
</template>
